<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DaaS Test App - Notes</title>
    <script src="/runtime-config.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: #f5f7fa;
        color: #1a1a2e;
        line-height: 1.6;
      }
      .app { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
      h1 { text-align: center; margin-bottom: 0.5rem; color: #16213e; }
      .subtitle { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.9rem; }
      .status-bar {
        display: flex; gap: 1rem; justify-content: center; margin-bottom: 2rem;
        flex-wrap: wrap;
      }
      .status-badge {
        padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem;
        font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem;
      }
      .status-badge.connected { background: #d4edda; color: #155724; }
      .status-badge.disconnected { background: #f8d7da; color: #721c24; }
      .status-badge.loading { background: #fff3cd; color: #856404; }
      .card {
        background: white; border-radius: 12px; padding: 1.5rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 1.5rem;
      }
      .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #16213e; }
      .form-group { margin-bottom: 0.75rem; }
      label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; color: #444; }
      input, textarea {
        width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #ddd;
        border-radius: 8px; font-size: 0.95rem; font-family: inherit;
        transition: border-color 0.2s;
      }
      input:focus, textarea:focus { outline: none; border-color: #4a90d9; }
      textarea { resize: vertical; min-height: 80px; }
      .btn {
        padding: 0.6rem 1.4rem; border: none; border-radius: 8px;
        font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
      }
      .btn-primary { background: #4a90d9; color: white; }
      .btn-primary:hover { background: #357abd; }
      .btn-primary:disabled { background: #a0c4e8; cursor: not-allowed; }
      .btn-danger { background: #e74c3c; color: white; }
      .btn-danger:hover { background: #c0392b; }
      .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.8rem; }
      .btn-outline { background: transparent; border: 1px solid #ddd; color: #555; }
      .btn-outline:hover { background: #f5f5f5; }
      .note-item {
        border: 1px solid #eee; border-radius: 10px; padding: 1rem;
        margin-bottom: 0.75rem;
      }
      .note-item h3 { font-size: 1rem; margin-bottom: 0.3rem; }
      .note-item .meta { font-size: 0.75rem; color: #999; margin-bottom: 0.5rem; }
      .note-item .content { font-size: 0.9rem; color: #444; white-space: pre-wrap; margin-bottom: 0.75rem; }
      .note-actions { display: flex; gap: 0.5rem; }
      .loading-msg { text-align: center; color: #888; padding: 2rem; }
      .error-msg { background: #f8d7da; color: #721c24; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; }
      .success-msg { background: #d4edda; color: #155724; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; }
      .empty-msg { text-align: center; color: #888; padding: 2rem; }
      .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
        z-index: 1000;
      }
      .modal {
        background: white; border-radius: 12px; padding: 2rem; width: 90%; max-width: 500px;
      }
      .modal h2 { margin-bottom: 1rem; }
      .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
