version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: daas-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: daas_test_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daas_test_app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daas-test-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: daas_test_app
      DB_USER: postgres
      DB_PASSWORD: postgres
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: daas-test-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      BACKEND_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  pgdata:

